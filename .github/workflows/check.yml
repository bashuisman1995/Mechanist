name: controle
on: [push, pull_request]
jobs:
  index-actueel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: index.html moet gebouwd zijn uit src/
        run: npm run check
      - name: JavaScript-syntax van de bundel
        run: node --check build/app.js
